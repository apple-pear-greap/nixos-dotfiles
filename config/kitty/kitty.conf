# vim:fileencoding=utf-8:foldmethod=marker
enabled_layouts splits:default, stack, tall

# BEGIN_KITTY_FONTS
font_family      family="Maple Mono NF CN"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0
# END_KITTY_FONTS
#
allow_remote_control yes
listen_on unix:/tmp/kitty
enabled_layouts splits

# cursor_trail
cursor_trail 0
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 3
# cursor_trail_color none

background_opacity 0.90
background_blur 1
copy_on_select yes
enable_audio_bell no
hide_window_decorations no
input_delay 3
scrollback_lines 5000
confirm_os_windows_close -1
shell_integration enable
tab_bar_style powerline

# key map
map ctrl+x no_op
map alt+x>r	load_config_file
map ctrl+x>v	launch --location=vsplit --cwd=current
map ctrl+x>b	launch --location=hsplit --cwd=current
map ctrl+x>q close_window_with_confirmation ignore-shell
map ctrl+x>r start_resizing_window

# windows guide
map ctrl+x>j neighboring_window down
map ctrl+x>k neighboring_window up
map ctrl+x>h neighboring_window left
map ctrl+x>l neighboring_window right

# move windows
map alt+x>j move_window down
map alt+x>k move_window up
map alt+x>h move_window left
map alt+x>l move_window right

# tabs
map ctrl+x>t new_tab
map alt+x>t new_tab_with_cwd
# map ctrl+x>q close_tab

# tabs guide
map ctrl+x>1 goto_tab 1
map ctrl+x>2 goto_tab 2
map ctrl+x>3 goto_tab 3
map ctrl+x>4 goto_tab 4
map ctrl+x>5 goto_tab 5
map ctrl+x>6 goto_tab 6
map ctrl+x>7 goto_tab 7
map ctrl+x>8 goto_tab 8
map ctrl+x>9 goto_tab 9

map ctrl+x>p previous_tab
map ctrl+x>n next_tab

# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# END_KITTY_THEME
