set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on
set -g extended-keys on
set -g extended-keys-format csi-u

# start numbering at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-window on

set -g allow-passthrough on

unbind C-b
set -g prefix C-x
bind-key C-x send-prefix

unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

unbind %
unbind '"'
unbind v
unbind b
bind | split-window -h -c "$HOME"
bind - split-window -v -c "$HOME"
bind v split-window -h -c "#{pane_current_path}"
bind b split-window -v -c "#{pane_current_path}"

unbind t
bind t new-window -c "#{pane_current_path}"
bind T new-window -c "$HOME"

unbind q
bind q kill-pane

bind [ previous-window
bind ] next-window
bind -n M-[ previous-window
bind -n M-] next-window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vim style copying
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selecion
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

set -g status-interval 0

#theme

gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

set -g status-position top
set -g status "on"
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${green_soft},bold] #S #[fg=${gray_light},nobold]|"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

set -g window-status-current-format "#[fg=${gray_medium},bg=default,bold]#I:#[fg=${blue_muted},bg=default](*)#[fg=${cyan_soft},bg=default]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) #[fg=${blue_muted},bg=default]"

set -g window-status-format "#[fg=${gray_medium},bold]#I:#[fg=${gray_light}]#W "

set -g status-right "#[fg=${green_soft}]󰲋 #W"
